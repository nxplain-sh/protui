name: Release

# Tags only. CI has already run on main by the time a release tag exists, so
# there is nothing to gate here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    # protui supports macOS and Linux only; each on both architectures. Linux
    # builds link musl statically, so one binary runs on any distribution.
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The toolchain pinned in rust-toolchain.toml, plus this job's target.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          build-warnings: warn

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export PROTUI_VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release --locked --target "$TARGET"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="protui_${GITHUB_REF_NAME#v}_${TARGET}"
          mkdir "$name"
          cp "target/$TARGET/release/protui" LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: protui_*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > checksums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes

  site:
    name: Redeploy the site
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Runs the Pages workflow on main, where the site's source lives, and it
      # writes in the release that now exists. Deploying from the tag instead
      # would publish the site as it was at the tag, and the github-pages
      # environment accepts deployments from main only by default.
      - name: Run the Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  homebrew:
    name: Update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          rustflags: ""
          build-warnings: warn

      # Written from the checksums the release just published, so the formula
      # names exactly the archives users download.
      - name: Write the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
          cargo xtask formula "$GITHUB_REF_NAME" checksums.txt > protui.rb

      # GITHUB_TOKEN reaches this repository only. HOMEBREW_TAP_TOKEN is a
      # fine-grained token with contents: write on the tap and nothing else.
      - name: Push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: nxplain-sh/homebrew-tap
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set, so $TAP was not updated."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula
          cp protui.rb tap/Formula/protui.rb
          cd tap
          git add Formula/protui.rb
          if git diff --cached --quiet; then
            echo "The formula is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "protui ${GITHUB_REF_NAME#v}"
          git push
