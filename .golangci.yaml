version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - revive
    - unconvert
    - goconst
    - nakedret
    - errorlint
    - gosec

  settings:
    revive:
      rules:
        - name: exported
          disabled: false
    # No locale is set on purpose. Enforcing UK spelling would flag Go and
    # third-party identifiers that are US-spelled by convention and cannot be
    # renamed: serde's Serialize trait, lipgloss.Color, lipgloss.Center. Left
    # unset, misspell catches genuine typos and leaves the prose alone.
    misspell: {}

  exclusions:
    rules:
      # Fixture-heavy table tests repeat short literals by design.
      - path: _test\.go
        linters:
          - goconst
      # Test files read fixtures by name and construct hostile inputs on
      # purpose; gosec's file-inclusion and subprocess rules do not apply.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nxplain-sh/protui
