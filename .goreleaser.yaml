# GoReleaser configuration. The release workflow runs this on a v* tag; run
# it locally with `goreleaser release --snapshot --clean` to see the artefacts
# without publishing anything.
version: 2

project_name: protui

builds:
  - id: protui
    main: ./cmd/protui
    binary: protui
    env:
      - CGO_ENABLED=0
    # protui supports macOS and Linux only; each on both architectures.
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: protui
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
